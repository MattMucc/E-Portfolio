<!DOCTYPE html>
<html lang = "en">
  <head>
    <meta charset = "UTF-8" />
    <meta name = "viewport" content = "width=device-width, initial-scale=1.0" />
    <title>Matthew Mucciacciaro</title>
    <link rel = "stylesheet" href = "./style.css" />
    <script src = "https://kit.fontawesome.com/928f079f3b.js" crossorigin = "anonymous"></script>
  </head>
  <body>
    <section id = "about-me">
      <nav>
        <div class = "personal__logo">Matthew Mucciacciaro</div>
        <ul class = "nav__link--list">
            <li>
                <a class = "nav__link--anchor link__hover-effect link__hover-effect--black" href="">
                    Languages
                </a>
            </li>
            <li>
                <a class = "nav__link--anchor link__hover-effect link__hover-effect--black" href="">
                    Projects
                </a>
            </li>
            <li>
                <a class = "nav__link--anchor nav__link--anchor-primary" href="">
                    Contact
                </a>
            </li>
        </ul>
      </nav>
      <div class = "flex flex-1">
        <div class = "about-me__info row">
            <div class = "about-me__info--container">
                <figure class = "about-me__picture--mask">
                    <img class = "about-me__picture" src = "assets/Base Graduation.jpeg" alt = "Picture of Matthew Mucciacciaro">
                </figure>
                <h1 class = "about-me__info--title">
                    Hey! I'm <span class = "text--purple">Matthew Mucciacciaro</span>
                </h1>
                <p class = "about-me__info--paragraph">
                    I'm learning <strong class = "text--purple">frontend software engineering</strong> to further my skillset in the tech industry!
                </p>
                <div class="about-me__links">
                    <a class = "about-me__link" href = "">
                        <i class="fa-brands fa-square-linkedin"></i>
                    </a>
                    <a class = "about-me__link" href = "">
                        <i class="fa-brands fa-github"></i>
                    </a>
                </div>
            </div>
            <figure class = "about-me__img--container">
                <img class = "about-me__img" src = "assets/Undraw Programming.svg" alt = "Picture of person programming">
            </figure>
        </div>
      </div>
    </section>

    <section id = "languages">
        <div class = "container">
            <div class = "row">
                <h1 class = "section__title">These are my known <span class = "text--purple">programming languages</span></h1>
                <div class = "language__list">
                    <div class = "language">
                        <figure class = "language__img--wrapper">
                            <img class = "language__img" src = "assets/HTML5 Logo.png" alt = "HTML Icon">
                        </figure>
                    </div>
                    <div class = "language">
                        <figure class = "language__img--wrapper">
                            <img class = "language__img" src = "assets/CSS Logo.png" alt = "CSS Icon">
                        </figure>
                    </div>
                    <div class = "language">
                        <figure class = "language__img--wrapper">
                            <img class = "language__img" src = "assets/C++ Logo.svg" alt = "C++ Icon">
                        </figure>
                    </div>
                    <div class = "language">
                        <figure class = "language__img--wrapper">
                            <img class = "language__img" src = "assets/C-Sharp Logo.svg" alt = "C-Sharp Icon">
                        </figure>
                    </div>
                    <div class = "language">
                        <figure class = "language__img--wrapper">
                            <img class = "language__img" src = "assets/SQL Logo.svg" alt = "SQL Icon">
                        </figure>
                    </div>
                    <div class = "language">
                        <figure class = "language__img--wrapper">
                            <img class = "language__img" src = "assets/LUA Logo.svg" alt = "Lua Icon">
                        </figure>
                    </div>
                </div>
            </div>
        </div>
    </section>
  </body>
</html>
